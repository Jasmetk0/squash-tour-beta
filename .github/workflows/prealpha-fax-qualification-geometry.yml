name: Pre-alpha FAX Gold/Platinum Qualification Geometry

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/beta_engine/domain/tournaments/fax_reference_bracket_topology.py'
      - 'tests/domain/test_fax_reference_bracket_topology.py'
      - 'src/beta_engine/domain/tournaments/fax_reference_player_draw.py'
      - 'src/beta_engine/application/fax_reference_player_draw.py'
      - 'src/beta_engine/application/canonical_tournament_topology.py'
      - 'src/beta_engine/application/canonical_knockout_feeders.py'
      - 'src/beta_engine/application/saved_fax_knockout_feeders.py'
      - 'tests/application/test_canonical_knockout_feeders.py'
      - 'tests/application/test_saved_fax_knockout_feeders.py'
      - 'src/beta_engine/domain/tournaments/draw_input_authority.py'
      - 'src/beta_engine/infrastructure/db/tournament_draw_input_authority.py'
      - 'tests/infrastructure/test_fax_reference_player_draw.py'
      - 'tools/preview_fax_reference_brackets.py'
      - 'docs/FAX_REFERENCE_KNOCKOUT_GEOMETRY_V1.md'
      - '.github/workflows/prealpha-fax-qualification-geometry.yml'
      - 'src/beta_engine/domain/tournaments/draw_authority.py'
      - 'src/beta_engine/application/pre_alpha_fax_acceptance_calendar_source.py'
      - 'config/tournament_templates/**'
      - 'config/points/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fax-bracket-geometry-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verified-topology:
    name: All 80 source Main and Q section graphs, no player fabrication
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Original 80 FAX Gold and Platinum canonical topology and adversarial tests
        run: GITHUB_EVENT_NAME=fax_qualification_geometry_acceptance python -m pytest tests/domain/test_fax_reference_bracket_topology.py -vv --maxfail=1
      - name: Real player Draw, HTTP SQLite retry, Saved restore and historical compatibility
        # A scoped acceptance job must execute its unchanged regression modules too.
        # The ordinary PR changed-test selector is intentionally not this gate.
        run: >-
          GITHUB_EVENT_NAME=fax_qualification_geometry_acceptance python -m pytest
          tests/infrastructure/test_fax_reference_player_draw.py
          tests/application/test_canonical_tournament_topology.py
          tests/application/test_canonical_knockout_feeders.py
          tests/application/test_saved_fax_knockout_feeders.py
          tests/domain/test_calendar_global_slot_contracts.py
          tests/infrastructure/test_tournament_draw_authority.py
          tests/infrastructure/test_tournament_draw_input_authority.py
          tests/domain/test_tournament_entry_field.py
          tests/api/test_admin_tournament_draw_authority_api.py
          tests/api/test_admin_tournament_wild_cards_api.py
          -vv --maxfail=1
      - name: Produce actual deterministic non-playable source bracket report
        run: |
          python -m tools.preview_fax_reference_brackets --output "$RUNNER_TEMP/fax-80-qualification-geometry.json"
          python - "$RUNNER_TEMP/fax-80-qualification-geometry.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding="utf-8"))
          assert report["schema_version"]=="fax_reference_bracket_geometry_summary.v1"
          assert report["edition_count"]==80
          assert report["results_generated"]==0
          assert report["sporting_execution_ready"] is False
          assert report["qualification_winners_known"] is False
          assert report["totals"]["potential_actual_matches"]==3440
          assert report["totals"]["qualification_entrants"]==1600
          assert report["totals"]["qualification_byes"]==320
          assert report["totals"]["main_byes"]==320
          print("PASS: original 80-event source, 3440 potential actual matches; zero simulated.")
          PY
      - name: Preserve honest source geometry preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fax-80-qualification-geometry-${{ github.run_id }}
          path: ${{ runner.temp }}/fax-80-qualification-geometry.json
          if-no-files-found: warn
          retention-days: 14

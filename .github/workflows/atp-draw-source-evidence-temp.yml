name: ATP draw source evidence (temporary)
on:
  pull_request:
    branches: [chatgpt/atp-2025-w52-profiles]
    paths: ['.github/workflows/atp-draw-source-evidence-temp.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and inspect official draw PDFs
        shell: bash
        run: |
          set -euo pipefail
          command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y poppler-utils; }
          mkdir -p "$RUNNER_TEMP/atp-draws"
          cd "$RUNNER_TEMP/atp-draws"
          errors=0
          for tournament in 2025/451 2025/495 2025/500 2024/495 2024/500 2024/451; do
            for draw in mds qs; do
              url="https://www.protennislive.com/posting/$tournament/$draw.pdf"
              file="${tournament//\//-}-$draw.pdf"
              echo "::group::$url"
              if curl --fail --silent --show-error --location --retry 1 --connect-timeout 10 --max-time 25 "$url" -o "$file" && head -c 5 "$file" | grep -q '%PDF-' && pdftotext -layout "$file" "$file.txt"; then
                sha256sum "$file"
                wc -c "$file"
                cat "$file.txt"
              else
                errors=$((errors+1))
                echo "SOURCE_UNAVAILABLE $url"
              fi
              echo "::endgroup::"
            done
          done
          echo "Unsuccessful sources: $errors"

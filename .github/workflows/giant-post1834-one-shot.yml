name: One-shot giant Saved v2 load after PR1834

# Explicitly approved, one-shot full scale load. Creating this isolated Draft PR
# triggers the workflow once; updates and reopen do not retrigger it.
on:
  pull_request:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: giant-post1834-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  full-five-season:
    if: ${{ github.event.pull_request.head.ref == 'test/giant-post1834-saved-v2-20261120' }}
    name: 1000 players / Saved v2 / 5 seasons / real HTTP SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned backend test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Execute disposable five-season compatible load with strict time budget
        env:
          PYTHONPATH: src:.:tests/api
          GITHUB_EVENT_NAME: giant_native_load
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          python scripts/giant_native_five_season_load.py \
            --profile compatible \
            --players 1000 \
            --seasons 5 \
            --editions-per-season 60 \
            --born-per-season 80 \
            --saved-v2 \
            --allow-five-season-run \
            --budget-minutes 315 \
            --output-dir giant-post1834-evidence \
            2>&1 | tee giant-post1834-console.log
      - name: Preserve diagnostics on success, failure, or budget exhaustion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: giant-post1834-metrics-${{ github.run_id }}
          path: |
            giant-post1834-evidence/summary.json
            giant-post1834-evidence/timeline.jsonl
            giant-post1834-console.log
          if-no-files-found: warn
          retention-days: 14
      - name: Reject modifications to tracked files
        if: always()
        shell: bash
        run: git diff --exit-code HEAD -- .

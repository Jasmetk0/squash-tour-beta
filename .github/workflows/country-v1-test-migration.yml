name: One-off Country V1 test migration

on:
  push:
    branches:
      - agent/country-v1-frontend-types
    paths:
      - .github/workflows/country-v1-test-migration.yml

permissions:
  contents: write

jobs:
  migrate-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/country-v1-frontend-types
          fetch-depth: 0

      - name: Replace stale Country Style DNA integration test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/src/App.module17.test.tsx')
          text = path.read_text()

          start_marker = "  it('edits, cancels, and saves a Custom country with geography and protected fields excluded', async () => {"
          next_marker = "\n  it("

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Country edit integration test start marker not found')
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Country edit integration test start marker is not unique')

          end = text.find(next_marker, start + len(start_marker))
          if end < 0:
              raise SystemExit('Could not find the next integration test after Country edit test')

          replacement = r'''  it('edits, cancels, and saves a Custom country with geography and protected fields excluded', async () => {
            const detail=editableCountryDetail(); api.getWorldPackageCountry.mockResolvedValue(detail)
            api.getWorldPackageGeography.mockResolvedValue({ world_id:'my_custom_world',continents:[{code:'EUR',name:'Europe'}],regions:[{code:'EUROPE',name:'Europe',continent_code:'EUR'},{code:'ASIA',name:'Asia',continent_code:null}],travel_regions:[{code:'EUROPE',name:'Europe',description:null},{code:'ASIA',name:'Asia',description:null}] })
            const queryClient=renderAppAt('/admin/world/library/my_custom_world/countries/GER'); const invalidate=vi.spyOn(queryClient,'invalidateQueries')
            fireEvent.click(await screen.findByRole('button',{name:'Edit country'}))
            expect(screen.getByLabelText('Name')).toHaveValue('Germanica')
            expect(within(screen.getByLabelText('Region')).getByRole('option',{name:'Asia (ASIA)'})).toBeInTheDocument()
            expect(within(screen.getByLabelText('Travel Region')).getByRole('option',{name:'Asia (ASIA)'})).toBeInTheDocument()
            fireEvent.change(screen.getByLabelText('Name'),{target:{value:'Unsaved'}}); fireEvent.click(screen.getByRole('button',{name:'Cancel'}))
            expect(api.updateWorldPackageCountry).not.toHaveBeenCalled(); expect(screen.getByRole('heading',{name:'Germanica'})).toBeInTheDocument()
            fireEvent.click(screen.getByRole('button',{name:'Edit country'})); fireEvent.change(screen.getByLabelText('Name'),{target:{value:'Germanica Prime'}}); fireEvent.change(screen.getByLabelText('Squash Popularity'),{target:{value:'4'}}); fireEvent.change(screen.getByLabelText('Development Quality'),{target:{value:'4'}})
            const updated={...detail,country:{...detail.country,name:'Germanica Prime',squash_popularity:4,development_quality:4},package:{...detail.package,fingerprint:'fingerprint-after'}}
            api.updateWorldPackageCountry.mockResolvedValueOnce({country_detail:updated,package:updated.package,validation:{world_id:'my_custom_world',status:'warnings',error_count:0,warning_count:1,info_count:1,checks:[]}})
            fireEvent.click(screen.getByRole('button',{name:'Save changes'}))
            await waitFor(()=>expect(api.updateWorldPackageCountry).toHaveBeenCalled())
            const payload=api.updateWorldPackageCountry.mock.calls[0][2]
            expect(payload).toMatchObject({name:'Germanica Prime',region:'EUROPE',squash_popularity:4,squash_access:5,development_quality:4,competition_quality:4,elite_support:5,squash_tradition:3,expected_package_fingerprint:'fingerprint-before'})
            for (const protectedField of ['code','population','default_population','default_population_year','population_by_year']) expect(payload).not.toHaveProperty(protectedField)
            for (const legacyField of ['wealth_support','system_quality','competition_density','federation_quality','style_dna']) expect(payload).not.toHaveProperty(legacyField)
            expect(await screen.findByText('Country changes saved. Validation status: warnings.')).toBeInTheDocument()
            expect(invalidate).toHaveBeenCalledWith({queryKey:['world-package-countries','my_custom_world']}); expect(invalidate).toHaveBeenCalledWith({queryKey:['world-package-validation','my_custom_world']}); expect(invalidate).toHaveBeenCalledWith({queryKey:['world-packages']})
            expect(screen.queryByRole('button',{name:'Save changes'})).not.toBeInTheDocument(); expect(screen.getByRole('heading',{name:'Germanica Prime'})).toBeInTheDocument()
          })'''

          updated = text[:start] + replacement + text[end:]
          if updated == text:
              raise SystemExit('Migration produced no change')
          if 'Style DNA value 1' in updated or 'Add Style DNA entry' in updated:
              raise SystemExit('Legacy Style DNA authoring assertion still present')

          path.write_text(updated)
          PY

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "web/src/App.module17.test.tsx"
          git diff --check
          grep -F "Development Quality" web/src/App.module17.test.tsx >/dev/null
          grep -F "for (const legacyField of ['wealth_support','system_quality','competition_density','federation_quality','style_dna'])" web/src/App.module17.test.tsx >/dev/null
          if grep -F "Style DNA value 1" web/src/App.module17.test.tsx >/dev/null; then
            echo 'Legacy Style DNA edit assertion remains' >&2
            exit 1
          fi

      - name: Commit guarded migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/App.module17.test.tsx
          git commit -m 'Migrate Country integration test to V1'
          git push origin HEAD:agent/country-v1-frontend-types

name: Fast CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4

      # Fast CI routes work by changed paths to shorten feedback loops.
      # Full validation remains available in the separate "Full Test Suite" workflow.
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '.github/workflows/**'
            frontend:
              - 'web/**'
              - 'web/package.json'
              - 'web/package-lock.json'
              - '.github/workflows/**'
            docs_only:
              - 'docs/**'
              - '**/*.md'

  backend-tests:
    name: Backend tests (targeted)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install backend dependencies
        run: pip install -e '.[dev]'
      - name: Run targeted backend tests
        run: |
          pytest \
            tests/application/test_season_registry_service.py \
            tests/api/test_admin_season_registry_api.py

  frontend-checks:
    name: Frontend build + critical tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run critical frontend tests
        run: npm run test -- App.module17.test.tsx Layout.test.tsx
      - name: Run web build
        run: npm run build

  docs-only-check:
    name: Docs-only quick check
    needs: changes
    if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.backend != 'true' && needs.changes.outputs.frontend != 'true'
    runs-on: ubuntu-latest
    steps:
      # Docs-only changes intentionally skip expensive backend/frontend jobs.
      - name: Docs-only change detected
        run: |
          echo "Docs-only change: skipping backend/frontend CI jobs in Fast CI."

name: Saved Branch Export Browser

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'web/src/api/runBranchArchiveExport*'
      - 'web/src/components/SavedBranchArchiveExportPanel*'
      - 'web/src/i18n/savedBranchArchiveText.ts'
      - 'web/src/pages/RunManagementPage.tsx'
      - 'web/acceptance/saved_branch_archive_export_browser.py'
      - '.github/workflows/saved-branch-export-browser.yml'
  workflow_dispatch:

concurrency:
  group: saved-branch-export-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One-off read-only diagnostic. Remove after inspecting the existing finding.
  sonar-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      checks: read
    steps:
      - name: Inspect latest Sonar check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_CHECK_ID: "124552404484"
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/check-runs/${SONAR_CHECK_ID}/annotations?per_page=100" \
            --jq '.[] | {path, start_line, end_line, title, message, annotation_level}'
  real-export:
    name: Saved Branch archive / real Chromium + SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]' playwright
      - run: npm --prefix web ci
      - run: python -m playwright install --with-deps chromium
      - name: Actual export preview and browser download — exact bytes and no Save
        run: |
          timeout --signal=TERM --kill-after=10s 9m \
            python web/acceptance/saved_branch_archive_export_browser.py --root work/archive-export-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-branch-export-${{ github.run_id }}
          path: work/archive-export-browser/*
          retention-days: 14

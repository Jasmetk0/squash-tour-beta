name: Saved Branch Export Browser

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'web/src/api/runBranchArchiveExport*'
      - 'web/src/components/SavedBranchArchiveExportPanel*'
      - 'web/src/i18n/savedBranchArchiveText.ts'
      - 'web/src/pages/RunManagementPage.tsx'
      - 'web/acceptance/saved_branch_archive_export_browser.py'
      - '.github/workflows/saved-branch-export-browser.yml'
      - '.github/requirements/saved-branch-browser.lock.txt'
  workflow_dispatch:

concurrency:
  group: saved-branch-export-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  real-export:
    name: Saved Branch archive / real Chromium + SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements/saved-branch-browser.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes \
            -r .github/requirements/saved-branch-browser.lock.txt
      - run: npm --prefix web ci --ignore-scripts
      - run: python -m playwright install --with-deps chromium
      - name: Actual export preview and browser download — exact bytes and no Save
        run: |
          timeout --signal=TERM --kill-after=10s 9m \
            python web/acceptance/saved_branch_archive_export_browser.py --root work/archive-export-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-branch-export-${{ github.run_id }}
          path: work/archive-export-browser/*
          retention-days: 14

name: Native Calendar Season Boundary API

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/prealpha-native-season-api.yml'
      - 'src/beta_engine/application/calendar_tour_service.py'
      - 'src/beta_engine/application/calendar_sporting_week_service.py'
      - 'src/beta_engine/domain/players/calendar_sporting_week.py'
      - 'src/beta_engine/domain/players/calendar_sporting_checkpoint.py'
      - 'src/beta_engine/domain/tournaments/calendar_tour.py'
      - 'src/beta_engine/domain/tournaments/calendar_native_tour*.py'
      - 'src/beta_engine/domain/rankings/calendar*.py'
      - 'src/beta_engine/infrastructure/db/calendar_tour.py'
      - 'src/beta_engine/infrastructure/db/calendar_terminal_results.py'
      # Season Save/reopen also consumes the shared Saved validation boundary.
      - 'src/beta_engine/infrastructure/db/repositories.py'
      - 'src/beta_engine/infrastructure/db/native_fork_runtime_state.py'
      - 'src/beta_engine/infrastructure/db/native_fork_source_projection.py'
      - 'tests/api/test_native_calendar_season_transition.py'
      - 'tests/api/test_native_cross_season_edition.py'
      - 'src/beta_engine/domain/players/calendar_followup_knockout.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-season-api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-season:
    # Draft work gets Fast CI; review/manual runs retain full acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Season rollover and next-season Edition / real SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Actual HTTP and SQLite season transition
        run: |
          # Explicitly select the smoke module despite PR changed-module
          # filtering. Never truncate negative integrity/rollback assertions.
          GITHUB_EVENT_NAME=native_season_acceptance \
            python -m pytest \
              tests/api/test_native_calendar_season_transition.py \
              tests/api/test_native_cross_season_edition.py \
              -vv --maxfail=1 --durations=10

name: Pre-alpha Native Four Editions Consecutive Weeks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/api/test_native_four_editions_consecutive_weeks.py'
      - '.github/workflows/prealpha-native-four-editions-consecutive-weeks.yml'
      - 'src/beta_engine/application/calendar_tour*.py'
      - 'src/beta_engine/application/calendar_global_slot_service.py'
      - 'src/beta_engine/domain/tournaments/calendar_global_slots.py'
      - 'src/beta_engine/domain/rankings/calendar*.py'
      - 'src/beta_engine/infrastructure/db/calendar_tour.py'
      - 'src/beta_engine/api/routers/admin_calendar_tour.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-four-editions-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-four-editions:
    # Bounded 8-player experiment executes even in Draft. Never treat the
    # separate long Ready-only W80/1000 browser as if this replaces it.
    name: Four real Editions / two overlapping weeks / saved SQLite / actual rankings
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Actual HTTP/SQLite global-slot MatchEngine and two real Official Ranking weeks
        run: |
          GITHUB_EVENT_NAME=native_four_editions_acceptance \
            python -m pytest tests/api/test_native_four_editions_consecutive_weeks.py \
            -k test_four_actual_overlapping_editions_across_two_weeks_and_sqlite_restarts \
            -vv -s --basetemp "$RUNNER_TEMP/native-four-editions" --maxfail=1 --durations=10
      - name: Preserve actual SQLite state for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-four-editions-${{ github.run_id }}
          path: ${{ runner.temp }}/native-four-editions/
          if-no-files-found: warn
          retention-days: 7

name: Viewer Exact Player Comparison Browser

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'web/src/pages/viewer/explore/ViewerPlayerComparePage*'
      - 'web/src/pages/viewer/explore/viewerComparisonDisplay*'
      - 'web/acceptance/viewer_exact_player_compare_browser.py'
      - '.github/workflows/viewer-exact-player-comparison-browser.yml'
      - '.github/requirements/saved-branch-browser.lock.txt'
  workflow_dispatch:

concurrency:
  group: viewer-exact-compare-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chromium-sqlite:
    name: Real Chromium / persisted legacy Run / exact player #51+
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements/saved-branch-browser.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes \
            -r .github/requirements/saved-branch-browser.lock.txt
      - run: npm --prefix web ci --ignore-scripts
      - run: python -m playwright install --with-deps chromium
      - name: Real first-50 limit, exact player GET, real missing 404, CS/EN, no Save
        run: |
          timeout --signal=TERM --kill-after=10s 9m \
            python web/acceptance/viewer_exact_player_compare_browser.py --root work/viewer-exact-comparison-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-exact-compare-${{ github.run_id }}
          path: work/viewer-exact-comparison-browser/*
          retention-days: 14

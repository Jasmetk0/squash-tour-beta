name: Pre-alpha Native Two Signed Seasons

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/api/test_native_two_signed_seasons_live.py'
      - '.github/workflows/prealpha-native-two-signed-seasons.yml'
      - 'src/beta_engine/application/calendar_tour*.py'
      - 'src/beta_engine/domain/rankings/calendar*.py'
      - 'src/beta_engine/infrastructure/db/calendar_tour.py'
      - 'src/beta_engine/api/routers/admin_calendar_tour.py'
      - 'src/beta_engine/api/routers/viewer_calendar_tour.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-two-signed-seasons-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actual-two-season-editions:
    # This focused, real HTTP/SQLite test executes on Draft PRs as well.
    # It complements rather than bypasses all Ready-only release gates.
    name: Two real knockout Editions across two Signed Seasons and SQLite restarts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Actual S1 final-week and S2 first-week tournaments, rankings and signed history
        run: |
          # Force explicit acceptance to run even though test file is changed
          # and the global pr_critical suite excludes slow HTTP/SQLite smoke.
          GITHUB_EVENT_NAME=native_two_signed_seasons_acceptance \
            python -m pytest tests/api/test_native_two_signed_seasons_live.py \
            -k test_two_real_tournaments_and_two_signed_seasons_after_cold_restarts \
            -vv -s --basetemp "$RUNNER_TEMP/native-two-signed-seasons" \
            --maxfail=1 --durations=10
      - name: Retain actual SQLite for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-two-signed-seasons-${{ github.run_id }}
          path: ${{ runner.temp }}/native-two-signed-seasons/
          if-no-files-found: warn
          retention-days: 7

name: Apply authoritative simulation stabilization patch

on:
  push:
    branches:
      - chatgpt/stabilize-authoritative-simulation
    paths:
      - .github/workflows/chatgpt-stabilize-authoritative-simulation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'bootstrap stabilization patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stabilize-authoritative-simulation
          fetch-depth: 0
      - name: Apply reviewed stabilization edits
        run: python tools/chatgpt_stabilize_authoritative_simulation.py
      - name: Repair nested transaction guard indentation
        run: python -c "from pathlib import Path; p=Path('src/beta_engine/application/authoritative_run_simulation_driver.py'); t=p.read_text(encoding='utf-8'); old='                session.execute(text(\"BEGIN IMMEDIATE\"))\n            self._require_writable_scope(session, command.run_id, command.branch_id)\n                package = self._pending_package(session, command, request_fp)\n'; new='                session.execute(text(\"BEGIN IMMEDIATE\"))\n                self._require_writable_scope(session, command.run_id, command.branch_id)\n                package = self._pending_package(session, command, request_fp)\n'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1),encoding='utf-8')"
      - name: Remove one-shot patch tooling
        run: |
          rm tools/chatgpt_stabilize_authoritative_simulation.py
          rm .github/workflows/chatgpt-stabilize-authoritative-simulation.yml
      - name: Validate patch shape
        run: |
          python -m compileall -q src
          git diff --check
      - name: Commit stabilization
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stabilize authoritative simulation closure and replay history'
          git push origin HEAD:chatgpt/stabilize-authoritative-simulation

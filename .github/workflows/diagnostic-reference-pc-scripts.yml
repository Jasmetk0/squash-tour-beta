name: Diagnostic reference-PC measurement scripts on Windows

# Temporary evidence for the measurement-scripts Draft PR only; removed again
# in the next commit, never on buuk.
on:
  push:
    branches: [claude/inspiring-dirac-d2aqk6-measure]

permissions:
  contents: read

jobs:
  windows:
    if: contains(github.event.head_commit.message, '[reference-pc-scripts]')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install locked Windows wheels
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/windows-preview-win-amd64.lock.txt
      - name: Helper tests (including the Windows working-set reader)
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider -rs tests/infrastructure/test_process_measurement.py
      - name: Small real HTTP/SQLite Saved v2 growth case and restart
        shell: pwsh
        run: |
          python scripts/measure_saved_v2_growth.py case --storage saved_v2 --players 8 --width 12 --weeks 1 --root work/win-smoke --hardware-note "GitHub windows-latest"
          python -c "import json;d=json.load(open('work/win-smoke/summary.json'));print(json.dumps({k:d[k] for k in ('environment','build_wall_s','build_peak_rss_kib','files','restart')},indent=1))"

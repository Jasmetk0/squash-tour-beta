name: Fast CI

on:
  pull_request:

concurrency:
  group: fast-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4

      # Fast CI intentionally runs only a compact catastrophic-regression gate.
      # Frontend also runs changed/colocated tests. The separate "Full Test Suite"
      # retains complete coverage after merge to buuk and nightly.
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'config/world_packages/**'
              - 'config/player_generation/**'
              - 'scripts/**'
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '.github/workflows/**'
            frontend:
              # Canonical World Package changes affect API contracts consumed by the UI.
              - 'config/world_packages/**'
              - 'web/**'
              - 'web/package.json'
              - 'web/package-lock.json'
              - '.github/workflows/**'
            docs_only:
              - 'docs/**'
              - '**/*.md'

  backend-tests:
    name: Backend PR critical
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        # PR tests need production dependencies and pytest, but not the heavier
        # dev-only Ruff/httpx extras. The full workflow still installs all dev extras.
        run: python -m pip install -e . pytest
      - name: Compile backend source
        run: python -m compileall -q src
      - name: Run PR critical backend tests
        run: |
          python -m pytest -m pr_critical --maxfail=1 --durations=10

  frontend-checks:
    name: Frontend build + critical tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run stable critical frontend baseline
        run: |
          npm run test -- \
            src/test/faxReferenceFixture.test.ts \
            src/components/Layout.test.tsx \
            src/pages/admin/AdminHomePage.test.tsx \
            src/viewer/ViewerProductRunRouteContext.test.tsx \
            src/pages/AdminRankingCandidatesPage.test.tsx \
            src/pages/RankingPreparationPanel.test.tsx \
            src/pages/RankingSavePanel.test.tsx \
            src/api/rankingPreparation.test.ts \
            src/pages/AdminRunBranchesPage.test.tsx
      - name: Run frontend tests changed by this PR
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git -C .. fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t changed_files < <(
            git -C .. diff --name-only "$BASE_SHA" HEAD -- web/src |
              grep -E '^web/src/.*\.(ts|tsx)$' || true
          )

          declare -a tests=()
          for repo_path in "${changed_files[@]}"; do
            rel="${repo_path#web/}"
            if [[ "$rel" =~ \.test\.(ts|tsx)$ ]]; then
              tests+=("$rel")
              continue
            fi

            if [[ "$rel" == *.tsx ]]; then
              candidate="${rel%.tsx}.test.tsx"
              [[ -f "$candidate" ]] && tests+=("$candidate")
            elif [[ "$rel" == *.ts ]]; then
              candidate="${rel%.ts}.test.ts"
              [[ -f "$candidate" ]] && tests+=("$candidate")
            fi
          done

          if (( ${#tests[@]} == 0 )); then
            echo "No changed or colocated frontend tests found."
            exit 0
          fi

          mapfile -t unique_tests < <(printf '%s\n' "${tests[@]}" | sort -u)
          printf 'Running changed/colocated frontend tests:\n%s\n' "${unique_tests[*]}"
          npm run test -- "${unique_tests[@]}"
      - name: Run web build
        run: npm run build

  docs-only-check:
    name: Docs-only quick check
    needs: changes
    if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.backend != 'true' && needs.changes.outputs.frontend != 'true'
    runs-on: ubuntu-latest
    steps:
      # Docs-only changes intentionally skip expensive backend/frontend jobs.
      - name: Docs-only change detected
        run: |
          echo "Docs-only change: skipping backend/frontend CI jobs in Fast CI."

name: Diagnostic W12 Authenticated Event Append A-B

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/beta_engine/infrastructure/db/calendar_event_content_store_prototype.py'
      - 'tests/infrastructure/test_calendar_event_content_store_prototype.py'
      - 'scripts/benchmark_scoped_sporting_event_append_ab.py'
      - '.github/workflows/diagnostic-w12-event-append-ab.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: event-append-isolated-ab-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  original-vs-authenticated-append:
    name: A-B-B-A complete original SQLite 39-event manifests; exact restoration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact last passing experimental prototype
        uses: actions/checkout@v4
        with:
          ref: c7f631e102e20d849214d900885326ebcb564c79
          path: previous-prototype
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend
        run: python -m pip install -e . pytest
      - name: Check latest security and exact reconstruction regressions
        run: PYTHONPATH="$PWD/src:$PWD" python -m pytest tests/infrastructure/test_calendar_event_content_store_prototype.py -vv --maxfail=1
      - name: Download successful W12 physical SQLite from first 8 played real Editions
        uses: actions/download-artifact@v4
        with:
          name: native-populated-w12-43919075227
          run-id: 43919075227
          repository: Jasmetk0/squash-tour-beta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/authentic-w12
      - name: Independently verify 46 real Saved roots then compare 39 isolated appends
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mapfile -t databases < <(find "$RUNNER_TEMP/authentic-w12" -maxdepth 4 -type f -name 'populated-w12-256.db' ! -path '*/test_native_*current/*')
          if [ "${#databases[@]}" -ne 1 ]; then
            echo "::error::Original W12 source must be unique"
            exit 1
          fi
          python scripts/benchmark_scoped_sporting_event_append_ab.py \
            --database "${databases[0]}" \
            --original-module previous-prototype/src/beta_engine/infrastructure/db/calendar_event_content_store_prototype.py \
            --candidate-module src/beta_engine/infrastructure/db/calendar_event_content_store_prototype.py \
            --out "$RUNNER_TEMP/w12-event-append-ab"
      - name: Keep only numeric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w12-scoped-append-ab-${{ github.run_id }}
          path: ${{ runner.temp }}/w12-event-append-ab/
          if-no-files-found: warn
          retention-days: 7

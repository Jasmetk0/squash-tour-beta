name: Saved Revision Branch Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/saved-revision-branch-review.yml'
      - 'src/beta_engine/application/run_branch_creation_service.py'
      - 'src/beta_engine/infrastructure/db/saved_revision_branch_review.py'
      - 'src/beta_engine/domain/native_fork_source.py'
      - 'src/beta_engine/domain/native_fork_baseline.py'
      - 'src/beta_engine/domain/native_fork_sporting.py'
      - 'src/beta_engine/domain/native_fork_runtime.py'
      - 'src/beta_engine/application/native_fork_runtime*.py'
      - 'src/beta_engine/application/native_fork_publication.py'
      - 'src/beta_engine/infrastructure/db/native_fork_runtime_state.py'
      - 'tests/api/test_native_fork_public_continuation.py'
      - 'tests/infrastructure/test_native_fork_runtime_format.py'
      - 'src/beta_engine/application/native_fork_baseline_preparation.py'
      - 'src/beta_engine/application/native_fork_baseline_installation.py'
      - 'src/beta_engine/application/native_fork_sporting_service.py'
      - 'src/beta_engine/infrastructure/db/native_fork_baseline.py'
      - 'src/beta_engine/infrastructure/db/native_fork_installation.py'
      - 'src/beta_engine/infrastructure/db/native_fork_saved_root.py'
      - 'src/beta_engine/infrastructure/db/native_fork_source.py'
      - 'src/beta_engine/infrastructure/db/calendar_tour.py'
      - 'src/beta_engine/infrastructure/db/repositories.py'
      - 'src/beta_engine/infrastructure/db/native_fork_source_projection.py'
      - 'tests/infrastructure/test_native_fork_source_projection.py'
      - 'src/beta_engine/infrastructure/db/models.py'
      - 'src/beta_engine/api/routers/run_containers.py'
      - 'src/beta_engine/api/schemas.py'
      - 'web/src/pages/RunPage.tsx'
      - 'web/src/components/RunPackageSetupPanel*'
      - 'src/beta_engine/application/run_package_service.py'
      - 'web/src/components/SavedRevisionHistoryPanel*'
      - 'web/src/api/client.ts'
      - 'web/src/api/types.ts'
      - 'web/src/i18n/historyText.ts'
      - 'tests/api/test_saved_revision_branch_review_api.py'
      - 'tests/api/test_native_saved_branch_review.py'
      - 'tests/domain/test_native_fork_source.py'
      - 'tests/domain/test_native_fork_baseline.py'
      - 'tests/domain/test_native_fork_sporting.py'
      - 'tests/api/test_native_fork_baseline_preparation.py'
      - 'tests/api/test_native_fork_baseline_installation.py'
      - 'tests/api/test_native_fork_sporting_birth.py'
      - 'tests/infrastructure/test_native_fork_saved_root.py'
      - 'tests/support/native_fork_baseline.py'
      - 'tests/support/native_fork_sporting.py'
      - 'scripts/saved_revision_branch_review_browser.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saved-branch-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  http-sqlite:
    # Draft work gets Fast CI; review/manual runs retain full acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Saved Branch review / actual HTTP SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Review, confirmed create, retry, rollback, restart and original source integrity
        run: |
          GITHUB_EVENT_NAME=saved_branch_review_acceptance \
            python -m pytest tests/api/test_saved_revision_branch_review_api.py \
              tests/api/test_native_saved_branch_review.py \
              tests/api/test_native_fork_baseline_preparation.py \
              tests/domain/test_native_fork_baseline.py \
              tests/domain/test_native_fork_sporting.py \
              tests/infrastructure/test_native_fork_saved_root.py -vv --maxfail=1 --durations=5

  native-public-continuation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native fork / public Tour Save restore and restart
    runs-on: ubuntu-latest
    # The complete local cold/restart/Viewer/extension scenario took 574s;
    # allow installation overhead without making this a per-push Draft check.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Actual birth, MatchEngine, points, restore, nested fork and source corruption
        run: |
          GITHUB_EVENT_NAME=saved_branch_review_acceptance \
            python -m pytest tests/api/test_native_fork_public_continuation.py \
              tests/infrastructure/test_native_fork_runtime_format.py \
              -vv --maxfail=1 --durations=5

  native-baseline-installation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native fork baseline / atomic SQLite staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Real native source, atomic baseline and independent match draft recovery
        run: |
          GITHUB_EVENT_NAME=saved_branch_review_acceptance \
            python -m pytest tests/api/test_native_fork_baseline_installation.py \
              -vv --maxfail=1 --durations=5

  native-fork-born-draft:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native fork / born-player draft and historical sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - name: Born player, later source epoch, independent original advancement and restart
        run: |
          GITHUB_EVENT_NAME=saved_branch_review_acceptance \
            python -m pytest tests/api/test_native_fork_sporting_birth.py \
              -vv --maxfail=1 --durations=5

  chromium:
    # Draft work gets Fast CI; review/manual runs retain full acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Saved Branch review / real Chromium CS EN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e . pytest playwright
      - run: npm --prefix web ci
      - name: Explicit confirmation and native continuation in the actual Admin
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_BIN" ]; then
            python -m playwright install --with-deps chromium
            export CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          fi
          python scripts/saved_revision_branch_review_browser.py --root work/saved-branch-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-branch-review-${{ github.run_id }}
          path: work/saved-branch-review/*
          retention-days: 14

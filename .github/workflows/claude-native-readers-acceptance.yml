name: Native career season and follow acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/claude-native-readers-acceptance.yml'
      - 'scripts/*_browser_acceptance.py'
      - 'src/beta_engine/application/calendar_*turn_pro.py'
      - 'src/beta_engine/application/calendar_initial_world*.py'
      - 'src/beta_engine/application/calendar_sporting_week_service.py'
      - 'src/beta_engine/application/calendar_tour*.py'
      - 'src/beta_engine/application/*follow*notification*.py'
      - 'src/beta_engine/domain/players/*turn_pro*.py'
      - 'src/beta_engine/domain/players/calendar_sporting_week.py'
      - 'src/beta_engine/domain/players/calendar_lifecycle.py'
      - 'src/beta_engine/domain/tournaments/calendar_tour.py'
      - 'src/beta_engine/application/native_fork*.py'
      - 'src/beta_engine/infrastructure/db/calendar_tour.py'
      - 'src/beta_engine/api/routers/admin_calendar_tour.py'
      - 'src/beta_engine/api/routers/admin_follow_notifications.py'
      - 'tests/api/*v87*.py'
      - 'tests/api/test_calendar_turn_pro_opening_adoption.py'
      - 'tests/api/test_native_season_archive*.py'
      - 'web/src/api/client.ts'
      - 'web/src/api/savedNativeReadiness.ts'
      - 'web/src/api/savedPlayerCareer.ts'
      - 'web/src/api/seasonArchive.ts'
      - 'web/src/api/followNotifications.ts'
      - 'web/src/components/SavedDrawNativeReadiness.tsx'
      - 'web/src/components/SavedPlayerCareerTimeline.tsx'
      - 'web/src/components/SeasonArchivePanel.tsx'
      - 'web/src/components/Follow*.tsx'
      - 'web/src/pages/FollowAlertsPage.tsx'
      - 'web/src/pages/SavedPlayerIdentityPage.tsx'
      - 'web/src/pages/CalendarTourPanel.tsx'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native readers / real HTTP SQLite / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [lifecycle, careers_alerts, seasons]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked backend test dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Run the actual source and persistence contracts
        env:
          CASE: ${{ matrix.case }}
          PYTHONPATH: src:.:tests/api
          GITHUB_EVENT_NAME: native_readers_acceptance
        shell: bash
        run: |
          case "$CASE" in
            lifecycle)
              python -m pytest -vv --maxfail=1 --durations=10 \
                tests/api/test_calendar_turn_pro_opening_adoption.py \
                tests/api/test_calendar_tour_turn_pro_v87_pre_tour.py \
                tests/api/test_calendar_tour_turn_pro_v87_default_model.py \
                tests/api/test_calendar_native_turn_pro_v87_birth.py \
                tests/api/test_native_fork_turn_pro_v87.py \
                tests/api/test_native_canonical_knockout_turn_pro_v87.py ;;
            careers_alerts)
              python -m pytest -vv --maxfail=1 --durations=10 \
                tests/api/test_calendar_tour_player_career_v87.py \
                tests/api/test_follow_notifications_v87.py \
                tests/api/test_native_fork_career_alerts_v87.py ;;
            seasons)
              python -m pytest -vv --maxfail=1 --durations=10 \
                tests/api/test_native_season_archive_comparison.py \
                tests/api/test_native_season_archive_wide.py -k 'not w52' ;;
          esac
      - name: Reject test writes to tracked inputs
        if: always()
        run: git diff --exit-code HEAD -- .

  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native readers / real Chromium / ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: [saved_draw_readiness, player_career, follow_alerts, season_archive]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install locked browser test dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/saved-branch-browser.lock.txt
      - run: npm --prefix web ci --ignore-scripts
      - name: Prepare real Chromium
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            echo "CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
          fi
      - name: Exercise the actual Admin page in CS and EN
        env:
          SCRIPT: ${{ matrix.script }}
          PYTHONPATH: src:.:tests/api
          GITHUB_EVENT_NAME: native_readers_acceptance
        run: |
          mkdir -p "$RUNNER_TEMP/native-reader-evidence"
          TMPDIR="$RUNNER_TEMP/native-reader-evidence" \
            python "scripts/${SCRIPT}_browser_acceptance.py" --chromium "$CHROME_BIN"
      - name: Reject test writes to tracked inputs
        if: always()
        run: git diff --exit-code HEAD -- .
      - name: Preserve actual browser and SQLite evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-reader-${{ matrix.script }}-${{ github.run_id }}
          path: ${{ runner.temp }}/native-reader-evidence/
          if-no-files-found: warn
          retention-days: 14

name: Full Test Suite

# Intentionally manual while pre-alpha is still being assembled. The complete
# backend/frontend regression gate is re-enabled as part of the final pre-alpha
# acceptance pass, instead of running after every merge or every night.
on:
  workflow_dispatch:

concurrency:
  group: full-tests-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  backend-full:
    name: Backend full pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: pip install -e '.[dev]'
      - name: Run full backend suite
        run: pytest --durations=20

  frontend-full:
    name: Frontend full tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run full frontend suite
        run: npm test
      - name: Run web build
        run: npm run build

name: Saved v2 season acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/saved-v2-acceptance.yml'
      - '.github/requirements/fast-ci-linux.lock.txt'
      - 'src/beta_engine/infrastructure/db/repositories.py'
      - 'src/beta_engine/infrastructure/db/saved_v2_*.py'
      - 'tests/api/test_saved_v2_*.py'
      - 'tests/api/test_native_season_archive_wide.py'
      - 'tests/infrastructure/test_saved_v2_*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saved-v2-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  saved-v2-seasons:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Saved v2 / two closed seasons / ${{ matrix.clock }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        clock: [w52, w61, w80]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Run real HTTP and SQLite Save, Restore and restart
        env:
          CLOCK: ${{ matrix.clock }}
          PYTHONPATH: src:.:tests/api
        shell: bash
        run: |
          unset GITHUB_EVENT_NAME
          python -m pytest -vv -s --maxfail=1 --durations=10 \
            "tests/api/test_saved_v2_long_seasons.py::test_saved_v2_two_closed_seasons_save_restart_restore[${CLOCK}]"
      - name: Reject test writes to tracked inputs
        if: always()
        run: git diff --exit-code HEAD -- .

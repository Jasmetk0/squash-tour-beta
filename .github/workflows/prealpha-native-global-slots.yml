name: Pre-alpha Native Global Slots

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/prealpha-native-global-slots.yml'
      - 'src/beta_engine/application/calendar_*'
      - 'src/beta_engine/application/native_*'
      - 'src/beta_engine/domain/tournaments/calendar_*'
      - 'src/beta_engine/domain/players/calendar_*'
      - 'src/beta_engine/domain/native_fork*'
      - 'src/beta_engine/infrastructure/db/calendar_*'
      - 'src/beta_engine/infrastructure/db/native_fork*'
      - 'src/beta_engine/infrastructure/db/repositories.py'
      - 'tests/api/test_calendar_global_slots*.py'
      - 'tests/domain/test_calendar_global_slot_contracts.py'
      - 'scripts/native_global_slots_browser.py'
      - 'web/src/pages/CalendarTourPanel*'
      - 'web/src/api/calendarTour.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-global-slots-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  global-core:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Global slots W${{ matrix.width }} / order / Save / retry / native fork / worker
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        width: [52, 61, 80]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Actual HTTP SQLite and MatchEngine contracts
        env:
          GLOBAL_SLOT_CALENDAR: ${{ matrix.width }}
        run: GITHUB_EVENT_NAME=native_global_slots_acceptance python -m pytest tests/api/test_calendar_global_slots.py -vv -s --basetemp "$RUNNER_TEMP/global-core-${{ matrix.width }}" --maxfail=1 --durations=10
      - name: Keep real SQLite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-core-${{ matrix.width }}-${{ github.run_id }}
          path: ${{ runner.temp }}/global-core-${{ matrix.width }}
          retention-days: 7

  global-calendar:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Global slots W${{ matrix.width }} / every actual week / real Season Transition
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        width: [52, 61, 80]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Real all-week calendar and signed season summary
        env:
          GLOBAL_SLOT_CALENDAR: ${{ matrix.width }}
        run: GITHUB_EVENT_NAME=native_global_slots_acceptance python -m pytest tests/api/test_calendar_global_slots_boundaries.py -k all_weeks -vv -s --basetemp "$RUNNER_TEMP/global-calendar-${{ matrix.width }}" --maxfail=1 --durations=10
      - name: Keep actual calendar history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-calendar-${{ matrix.width }}-${{ github.run_id }}
          path: ${{ runner.temp }}/global-calendar-${{ matrix.width }}
          retention-days: 7

  global-final-week:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Global final-week closing / separate approvals / restart / extension once
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - run: GITHUB_EVENT_NAME=native_global_slots_acceptance python -m pytest tests/api/test_calendar_global_slots_boundaries.py -k original_final -vv -s --basetemp "$RUNNER_TEMP/global-final-week" --maxfail=1 --durations=10
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-final-week-${{ github.run_id }}
          path: ${{ runner.temp }}/global-final-week
          retention-days: 7

  global-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Global slots W${{ matrix.width }} / real CS EN Chromium / SQLite restart
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        width: [52, 80]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e . pytest playwright
      - run: npm --prefix web ci
      - name: Prepare actual Chromium
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            echo "CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
          fi
      - name: Actual Admin multi-Edition sporting flow
        run: python scripts/native_global_slots_browser.py --root "$RUNNER_TEMP/global-browser-${{ matrix.width }}" --width ${{ matrix.width }} --chromium "$CHROME_BIN"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-browser-${{ matrix.width }}-${{ github.run_id }}
          path: ${{ runner.temp }}/global-browser-${{ matrix.width }}
          retention-days: 7

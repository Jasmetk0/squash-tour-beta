name: ATP 250 draw evidence (temporary)
on:
  pull_request:
    branches: [chatgpt/atp-2025-w52-profiles]
    paths: ['.github/workflows/atp-250-evidence-temp.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official draw PDFs and inspect
        shell: bash
        run: |
          set -euo pipefail
          command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y poppler-utils; }
          mkdir -p "$RUNNER_TEMP/atp250"
          cd "$RUNNER_TEMP/atp250"
          for tournament in 2024/321 2025/321 2025/322 2025/311 2025/717; do
            for draw in mds qs; do
              url="https://www.protennislive.com/posting/$tournament/$draw.pdf"
              file="${tournament//\//-}-$draw.pdf"
              echo "::group::$url"
              if curl --fail --silent --show-error --location --retry 1 --connect-timeout 8 --max-time 20 "$url" -o "$file" && head -c 5 "$file" | grep -q '%PDF-' && pdftotext -layout "$file" "$file.txt"; then
                sha256sum "$file"
                wc -c "$file"
                cat "$file.txt"
              else
                echo "SOURCE_UNAVAILABLE $url"
              fi
              echo "::endgroup::"
            done
          done

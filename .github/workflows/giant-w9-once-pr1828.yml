name: One-shot PR1828 1000-player W9 Saved v2 checkpoint

# Explicit action only: ONLY PR #1828's one-time label event.
# Neither opening, synchronize, push, reopening nor unrelated labels run it.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: one-shot-pr1828-w9-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  w9-1000-saved-v2:
    if: >-
      ${{ github.event.action == 'labeled' &&
          github.event.label.name == 'run-w9-saved-v2-pr1828-once' &&
          github.event.pull_request.number == 1828 &&
          github.event.pull_request.head.ref == 'test/saved-v2-1000-player-w9-checkpoint-20261119' }}
    name: Real HTTP/SQLite + Saved v2; finish W9 and stop
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Run bounded HTTP SQLite load (five seasons PROHIBITED)
        env:
          PYTHONPATH: src:.:tests/api
          GITHUB_EVENT_NAME: giant_native_load
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          python scripts/giant_native_five_season_load.py \
            --profile compatible \
            --players 1000 \
            --seasons 5 \
            --editions-per-season 60 \
            --born-per-season 80 \
            --saved-v2 \
            --stop-after-week 9 \
            --budget-minutes 315 \
            --output-dir giant-w9-evidence \
            2>&1 | tee giant-w9-console.log
      - name: Always upload partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr1828-one-shot-w9-${{ github.run_id }}
          path: |
            giant-w9-evidence/summary.json
            giant-w9-evidence/timeline.jsonl
            giant-w9-console.log
          if-no-files-found: warn
          retention-days: 21
      - name: Verify no source changes
        if: always()
        shell: bash
        run: git diff --exit-code HEAD -- .

name: Edition Entry Timing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/beta_engine/application/run_edition_entry_timing.py'
      - 'src/beta_engine/domain/tournaments/edition_entry_timing.py'
      - 'src/beta_engine/api/routers/admin_run_packages.py'
      - 'web/src/api/runEditionEntryTiming*'
      - 'web/src/api/client.ts'
      - 'web/src/components/RunEditionEntryTimingPanel*'
      - 'web/src/pages/PlannedEventDetailPage*'
      - 'web/src/i18n/editionEntryTimingText.ts'
      - 'scripts/edition_entry_timing_browser.py'
      - 'tests/api/test_run_edition_entry_timing_api.py'
      - '.github/workflows/edition-entry-timing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entry-timing-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Entry timing / real Chromium CS EN Save restart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]' playwright
      - run: npm --prefix web ci
      - run: python -m playwright install --with-deps chromium
      - name: Actual server Preview, lost Confirm reply, exact retry, explicit Save and physical reopen
        run: python scripts/edition_entry_timing_browser.py --root work/entry-timing-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edition-entry-timing-browser
          path: work/entry-timing-browser/
          retention-days: 7

name: Test Lab Session and Run Proposal Browser

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/lab-workflows-browser.yml'
      - 'scripts/lab_workflows_browser.py'
      - 'web/src/pages/*TestLabPage*'
      - 'web/src/components/Lab*'
      - 'web/src/api/client.ts'
      - 'src/beta_engine/application/*test_lab_service.py'
      - 'src/beta_engine/api/routers/admin_*test_lab.py'
      - 'src/beta_engine/infrastructure/db/run_tournament_lab_draft_state.py'

permissions:
  contents: read

concurrency:
  group: lab-workflows-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromium:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Real Lab Sessions / concurrent edits / reviewed Apply Save and restart
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e . pytest playwright
      - run: npm --prefix web ci
      - name: Real Match Tournament and Player Lab workflows
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_BIN" ]; then
            python -m playwright install --with-deps chromium
            export CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          fi
          python scripts/lab_workflows_browser.py --root work/lab-workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-workflows-${{ github.run_id }}
          path: work/lab-workflows/
          retention-days: 14

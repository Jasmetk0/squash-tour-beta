name: Manual 1000-player Saved v2 W9 HTTP SQLite checkpoint

# No PR/push trigger: adding a commit or updating any PR cannot start this load.
# The five-season execution gate is never passed by this workflow.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_W9_SAVED_V2_1000 to opt into the bounded W9 load"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: giant-w9-saved-v2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  bounded-w9:
    if: ${{ inputs.confirmation == 'RUN_W9_SAVED_V2_1000' }}
    name: Real HTTP SQLite / Saved v2 / 1000 players / through S1W9
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install original locked CI dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Real 1000-player HTTP SQLite checkpoint through week nine
        env:
          PYTHONPATH: src:.:tests/api
          GITHUB_EVENT_NAME: giant_native_load
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          python scripts/giant_native_five_season_load.py \
            --profile compatible \
            --players 1000 \
            --seasons 5 \
            --editions-per-season 60 \
            --born-per-season 80 \
            --saved-v2 \
            --stop-after-week 9 \
            --budget-minutes 315 \
            --output-dir giant-w9-evidence \
            2>&1 | tee giant-w9-console.log
      - name: Upload partial or complete real metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: giant-w9-saved-v2-${{ github.run_id }}
          path: |
            giant-w9-evidence/summary.json
            giant-w9-evidence/timeline.jsonl
            giant-w9-console.log
          if-no-files-found: warn
          retention-days: 21
      - name: No tracked files modified
        if: always()
        shell: bash
        run: git diff --exit-code HEAD -- .

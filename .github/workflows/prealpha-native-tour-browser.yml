name: Pre-alpha Native Tour Browser

on:
  pull_request:
    paths:
      - '.github/workflows/prealpha-native-tour-browser.yml'
      - 'scripts/native_tour_browser_acceptance.py'
      - 'tests/api/test_calendar_tour_flow.py'
      - 'src/beta_engine/**/calendar_tour*'
      - 'src/beta_engine/**/calendar_*knockout*'
      - 'src/beta_engine/**/calendar_*sporting*'
      - 'src/beta_engine/**/calendar_continuation*'
      - 'src/beta_engine/**/calendar_lifecycle.py'
      - 'src/beta_engine/infrastructure/db/player_lifecycle_state.py'
      - 'src/beta_engine/infrastructure/db/repositories.py'
      - 'src/beta_engine/infrastructure/db/calendar_standalone_match_state.py'
      - 'web/src/pages/CalendarTour*'
      - 'web/src/api/calendarTour.ts'
      - 'web/src/api/client.ts'
  workflow_dispatch:

concurrency:
  group: native-tour-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser:
    name: Native Tour W${{ matrix.width }} / ${{ matrix.players }} players
    runs-on: ubuntu-latest
    # A performance regression must fail promptly rather than consuming another
    # 25-30 minute CI cycle. The full W80 scenario remains mandatory.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 52, offset: 35, players: 8}
          - {width: 61, offset: 37, players: 8}
          - {width: 80, offset: 80, players: 1000}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]' playwright
      - run: npm --prefix web ci
      - name: Prepare Chromium
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            echo "CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
          fi
      - name: Configured Editions, real matches, manual Save and physical restart
        # Fail with explicit exit 124 BEFORE GitHub cancels the entire job at
        # its outer deadline. Upload progress.json on failure for diagnostics.
        run: |
          timeout --signal=TERM --kill-after=10s 18m \
            python scripts/native_tour_browser_acceptance.py \
              --root work/native-tour --width ${{ matrix.width }} \
              --offset ${{ matrix.offset }} --players ${{ matrix.players }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tour-W${{ matrix.width }}-${{ matrix.players }}-${{ github.run_id }}
          path: |
            work/native-tour/*.json
            work/native-tour/*.png
            work/native-tour/*.log
            work/native-tour/*.sqlite*
          retention-days: 14

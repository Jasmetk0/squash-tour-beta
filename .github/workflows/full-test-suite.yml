name: Full Test Suite

on:
  workflow_dispatch:
  push:
    branches:
      - buuk
  schedule:
    - cron: '0 5 * * *'

# Rapid merges to buuk supersede older push runs. Manual and scheduled runs use
# their unique run IDs, so they neither cancel one another nor a push run.
concurrency:
  group: full-tests-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  backend-full:
    name: Backend full pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: pip install -e '.[dev]'
      - name: Run full backend suite
        run: pytest --durations=20

  frontend-full:
    name: Frontend full tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Run full frontend suite
        run: npm test
      - name: Run web build
        run: npm run build

name: Diagnostic W12 Sporting Checkpoint Subtrees

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/profile_native_w12_sporting_checkpoint_subtrees.py'
      - '.github/workflows/diagnostic-native-w12-sporting-subtrees.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: w12-sporting-subtree-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  authentic-sporting-checkpoint-breakdown:
    name: Read-only nested sporting checkpoint accounting, all 42 actual revisions
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download already played 8-Edition/256-player SQLite, no re-simulation
        uses: actions/download-artifact@v4
        with:
          name: native-populated-w12-43919075227
          run-id: 43919075227
          repository: Jasmetk0/squash-tour-beta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/w12-sporting-real
      - name: Analyze nested sporting JSON by field and exact consecutive identity
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mapfile -t sources < <(find "$RUNNER_TEMP/w12-sporting-real" -maxdepth 4 -type f -name 'populated-w12-256.db' ! -path '*/test_native_*current/*')
          if [ "${#sources[@]}" -ne 1 ]; then
            echo "::error::Expected single numbered actual W12 SQLite"
            exit 1
          fi
          python scripts/profile_native_w12_sporting_checkpoint_subtrees.py \
            --database "${sources[0]}" \
            --out "$RUNNER_TEMP/w12-sporting-field-report"
      - name: Retain only small derived statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-w12-sporting-fields-${{ github.run_id }}
          path: ${{ runner.temp }}/w12-sporting-field-report/
          if-no-files-found: warn
          retention-days: 7

name: "One-shot giant Saved v2 performance comparison"

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/giant-saved-v2-performance-20261125.yml'

permissions:
  contents: read

concurrency:
  group: giant-saved-v2-performance-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  giant-saved-v2:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/giant-saved-v2-performance-20261125' }}
    name: 1000 players / 5 seasons / real HTTP SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout exact engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1a0de76db9b2497e33454fafc4fb659f636b5a6f
          path: engine
          persist-credentials: false
      - name: Checkout previously used load harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 51dbde8990e0118af9827485ac12d3f27286c3e4
          path: harness
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned backend test dependencies
        working-directory: engine
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Execute disposable five-season load
        working-directory: engine
        env:
          PYTHONPATH: src:.:tests/api
          GITHUB_EVENT_NAME: giant_native_load
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          lscpu
          free -b
          sha256sum ../harness/scripts/giant_native_five_season_load.py
          python ../harness/scripts/giant_native_five_season_load.py \
            --profile compatible \
            --players 1000 \
            --seasons 5 \
            --editions-per-season 60 \
            --born-per-season 80 \
            --saved-v2 \
            --allow-five-season-run \
            --budget-minutes 315 \
            --output-dir "$RUNNER_TEMP/giant-saved-v2-evidence" \
            2>&1 | tee "$RUNNER_TEMP/giant-saved-v2-console.log"
      - name: Preserve metrics and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: giant-saved-v2-performance-metrics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/giant-saved-v2-evidence/summary.json
            ${{ runner.temp }}/giant-saved-v2-evidence/timeline.jsonl
            ${{ runner.temp }}/giant-saved-v2-console.log
          if-no-files-found: warn
          retention-days: 14
      - name: Verify tracked engine files remain intact
        if: always()
        working-directory: engine
        run: git diff --exit-code HEAD --

name: Apply authoritative simulation stabilization patch

on:
  push:
    branches:
      - chatgpt/stabilize-authoritative-simulation
    paths:
      - .github/workflows/chatgpt-stabilize-authoritative-simulation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'bootstrap stabilization patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stabilize-authoritative-simulation
          fetch-depth: 0
      - name: Apply reviewed stabilization edits
        run: python tools/chatgpt_stabilize_authoritative_simulation.py
      - name: Repair nested transaction guard indentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/beta_engine/application/authoritative_run_simulation_driver.py')
          text = path.read_text(encoding='utf-8')
          old = '''                session.execute(text("BEGIN IMMEDIATE"))
            self._require_writable_scope(session, command.run_id, command.branch_id)
                package = self._pending_package(session, command, request_fp)
'''
          new = '''                session.execute(text("BEGIN IMMEDIATE"))
                self._require_writable_scope(session, command.run_id, command.branch_id)
                package = self._pending_package(session, command, request_fp)
'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one nested guard indentation defect, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot patch tooling
        run: |
          rm tools/chatgpt_stabilize_authoritative_simulation.py
          rm .github/workflows/chatgpt-stabilize-authoritative-simulation.yml
      - name: Validate patch shape
        run: |
          python -m compileall -q src
          git diff --check
      - name: Commit stabilization
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stabilize authoritative simulation closure and replay history'
          git push origin HEAD:chatgpt/stabilize-authoritative-simulation

name: Pre-alpha Large Initial Player Cohort Browser

on:
  pull_request:
    paths:
      - '.github/workflows/prealpha-large-initial-cohort-browser.yml'
      - 'scripts/admin_large_cohort_browser.py'
      - 'web/src/components/GeneratedPlayerReviewInspector.tsx'
      - 'web/src/components/RunInitialWorldSetupPanel.tsx'
      - 'web/src/api/runInitialWorldSetup.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-cohort:
    name: Real 1000 players UI, SQLite Save and restart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install engine and Playwright
        run: python -m pip install -e . playwright
      - name: Install frontend
        run: npm --prefix web ci
      - name: Prepare Chromium
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            echo "CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
          fi
      - name: Start Vite against isolated backend
        run: |
          VITE_API_BASE_URL=http://127.0.0.1:8018 npm --prefix web run dev -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/large-cohort-vite.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/large-cohort-vite.log"
          exit 1
      - name: Real 1000 player preview, Adopt, Save, ranking and restart
        run: |
          python scripts/admin_large_cohort_browser.py \
            --acceptance "$RUNNER_TEMP/large-cohort-run" \
            --port 8018 --base-url http://127.0.0.1:5173 \
            --chromium "$CHROME_BIN"
      - name: Preserve real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-cohort-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/large-cohort-run/artifacts/
            ${{ runner.temp }}/large-cohort-run/server.log
            ${{ runner.temp }}/large-cohort-vite.log
          if-no-files-found: warn
          retention-days: 14

name: Isolated giant native five-season load

# Explicitly scoped: unrelated PRs never trigger this expensive benchmark.
# This workflow is opt-in and path-scoped. GitHub may require registration on
# the default branch before a newly introduced workflow can execute.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/giant-native-five-seasons.yml'
      - 'scripts/giant_native_five_season_load.py'
      - 'tests/application/test_giant_native_load_plan.py'
  workflow_dispatch:

permissions:
  contents: read

# Never share a concurrency group with another workflow or another PR.
# Updating this PR cancels only its obsolete version, never anyone else's CI.
concurrency:
  group: giant-native-five-seasons-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan-contracts:
    name: Giant native load / requested 16-128 Q world plan contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Check exact plan and real Edition point tables
        env:
          PYTHONPATH: src:.
          GITHUB_EVENT_NAME: giant_native_load
        run: |
          python -m pytest -q -x tests/application/test_giant_native_load_plan.py
          python scripts/giant_native_five_season_load.py --profile requested --plan-only \
            --plan-json giant-load-plans/requested-16-128-qualification-world.json
          python scripts/giant_native_five_season_load.py --profile compatible --plan-only \
            --plan-json giant-load-plans/compatible-4-8.json
      - name: Upload the two exact, explicitly different tournament plans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: giant-native-plans-${{ github.run_id }}
          path: giant-load-plans/
          if-no-files-found: warn
          retention-days: 21

  five-seasons:
    name: Giant native load / 1000 players / 5x52 weeks / 300 compatible Editions
    needs: plan-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # This long job is genuine 4/8 Main-only compatibility load, NOT a
    # simulation of the larger requested Main/Qualification/World profile.
    # It is intentionally NOT a required Fast CI/merge gate.
    # Its independent, strict time budget is shorter than Actions' job timeout.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked backend test dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Run actual disposable HTTP SQLite simulation and keep metrics
        env:
          PYTHONPATH: src:.:tests/api
          GITHUB_EVENT_NAME: giant_native_load
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          set -o pipefail
          python scripts/giant_native_five_season_load.py \
            --profile compatible \
            --players 1000 \
            --seasons 5 \
            --editions-per-season 60 \
            --born-per-season 80 \
            --budget-minutes 315 \
            --output-dir giant-load-evidence \
            2>&1 | tee giant-load-console.log
      - name: Preserve partial metrics after pass, failure or budget expiration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: giant-five-season-metrics-${{ github.run_id }}
          path: |
            giant-load-evidence/summary.json
            giant-load-evidence/timeline.jsonl
            giant-load-console.log
          if-no-files-found: warn
          retention-days: 21
      - name: Reject any changes to tracked test sources
        if: always()
        shell: bash
        run: git diff --exit-code HEAD -- .

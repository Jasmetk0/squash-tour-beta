name: Pre-alpha Native Tour API Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/prealpha-native-tour-api.yml'
      - 'tests/api/test_calendar_tour_flow.py'
      - 'tests/api/test_calendar_population_sporting_checkpoint.py'
      - 'tests/infrastructure/test_calendar_component_proof_scope.py'
      - 'src/beta_engine/api/routers/admin_calendar_tour.py'
      - 'src/beta_engine/api/routers/viewer_calendar_tour.py'
      - 'src/beta_engine/domain/tournaments/calendar_tour.py'
      - 'src/beta_engine/domain/players/calendar_*'
      - 'src/beta_engine/domain/rankings/calendar_official.py'
      - 'src/beta_engine/application/calendar_tour_service.py'
      - 'src/beta_engine/application/calendar_standalone_match_service.py'
      - 'src/beta_engine/infrastructure/db/calendar_tour.py'
      - 'src/beta_engine/infrastructure/db/calendar_standalone_match_state.py'
      - 'src/beta_engine/infrastructure/db/calendar_sporting_checkpoint.py'
      - 'src/beta_engine/infrastructure/db/player_lifecycle_state.py'
      - 'src/beta_engine/infrastructure/db/player_health_state.py'
      - 'src/beta_engine/infrastructure/db/repositories.py'
  workflow_dispatch:

concurrency:
  group: native-tour-api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-tour-api:
    name: Native Tour signed restore / real HTTP / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - name: Real two-week Tour, restore and tamper regression
        # Full native integration stays mandatory. Fast CI must not run this
        # 20+ minute case serially before reporting useful targeted feedback.
        run: |
          # The PR conftest selects changed test *modules* by default.
          # This dedicated gate must run its original full acceptance even
          # when only production Tour logic changed in this PR.
          GITHUB_EVENT_NAME=native_tour_api_acceptance \
            python -m pytest tests/api/test_calendar_tour_flow.py \
            -vv --maxfail=1 --durations=10

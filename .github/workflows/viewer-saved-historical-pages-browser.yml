name: Viewer Saved Historical Pages Browser

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'web/acceptance/viewer_saved_historical_pages_browser.py'
      - '.github/workflows/viewer-saved-historical-pages-browser.yml'
      - 'web/src/pages/viewer/deferred/ViewerTourArchivePage*'
      - 'web/src/pages/viewer/deferred/ViewerPublishedTitleLeadersPage*'
      - 'web/src/pages/viewer/deferred/ViewerPublishedTournamentStatsPage*'
      - 'web/src/pages/viewer/deferred/ViewerSavedCountryStatsPage*'
      - 'web/src/pages/viewer/deferred/ViewerNo1PublishedHistoryPage*'
      - '.github/requirements/saved-branch-browser.lock.txt'
  workflow_dispatch:

concurrency:
  group: viewer-historical-pages-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chromium-sqlite:
    name: Real Saved calendar, country stats, published winners and No.1
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements/saved-branch-browser.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes \
            -r .github/requirements/saved-branch-browser.lock.txt
      - run: npm --prefix web ci --ignore-scripts
      - run: python -m playwright install --with-deps chromium
      - name: Persist three genuine Saved sources and verify read-only historical Viewer pages
        run: |
          timeout --signal=TERM --kill-after=10s 12m \
            python web/acceptance/viewer_saved_historical_pages_browser.py \
              --root work/viewer-historical-pages-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-historical-pages-${{ github.run_id }}
          path: work/viewer-historical-pages-browser/*
          retention-days: 14

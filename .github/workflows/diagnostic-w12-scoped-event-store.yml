name: Diagnostic Authenticated W12 Sporting Event Store Prototype

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/beta_engine/infrastructure/db/calendar_event_content_store_prototype.py'
      - 'tests/infrastructure/test_calendar_event_content_store_prototype.py'
      - 'scripts/benchmark_scoped_sporting_events_w12.py'
      - '.github/workflows/diagnostic-w12-scoped-event-store.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scoped-w12-event-store-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  actual-immutable-w12-events:
    name: Fail-closed SQLite adversarial tests and exact original W12 Save replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend and focused pytest dependencies
        run: python -m pip install -e . pytest
      - name: Verify SQL savepoints, owner isolation, ancestors and changed source rejection
        run: |
          PYTHONPATH="$PWD/src:$PWD" python -m pytest \
            tests/infrastructure/test_calendar_event_content_store_prototype.py \
            -vv --maxfail=1 --durations=10
      - name: Reuse original 256-player/8-real-Edition/24-match W12 SQLite
        uses: actions/download-artifact@v4
        with:
          name: native-populated-w12-43919075227
          run-id: 43919075227
          repository: Jasmetk0/squash-tour-beta
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/authentic-w12
      - name: Verify all original physical Saved revision hashes and event histories
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mapfile -t databases < <(find "$RUNNER_TEMP/authentic-w12" -maxdepth 4 -type f -name 'populated-w12-256.db' ! -path '*/test_native_*current/*')
          if [ "${#databases[@]}" -ne 1 ]; then
            echo "::error::Exactly one original numbered real W12 SQLite input expected"
            exit 1
          fi
          python scripts/benchmark_scoped_sporting_events_w12.py \
            --database "${databases[0]}" \
            --out "$RUNNER_TEMP/scoped-event-proof"
      - name: Retain only proof and byte metrics, never user's giant SQLite artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoped-w12-sporting-events-${{ github.run_id }}
          path: ${{ runner.temp }}/scoped-event-proof/
          if-no-files-found: warn
          retention-days: 7

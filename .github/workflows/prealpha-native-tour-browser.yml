name: Pre-alpha Native Tour Browser

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/prealpha-native-tour-browser.yml'
      - 'scripts/native_tour_browser_acceptance.py'
      - 'scripts/native_birth_readiness_browser_acceptance.py'
      - 'scripts/native_post_intake_tour_browser_acceptance.py'
      - 'scripts/native_prospect_source_epochs_browser_acceptance.py'
      - 'web/src/pages/NativeProspectSourceEpochPanel.tsx'
      - 'src/beta_engine/**/calendar_native_competition.py'
      - 'src/beta_engine/application/calendar_native_transition_readiness.py'
      - 'tests/api/test_calendar_tour_flow.py'
      - 'src/beta_engine/**/calendar_tour*'
      - 'src/beta_engine/**/calendar_*knockout*'
      - 'src/beta_engine/**/calendar_*sporting*'
      - 'src/beta_engine/**/calendar_continuation*'
      - 'src/beta_engine/**/calendar_lifecycle.py'
      - 'src/beta_engine/infrastructure/db/player_lifecycle_state.py'
      - 'src/beta_engine/infrastructure/db/repositories.py'
      - 'src/beta_engine/infrastructure/db/calendar_terminal_results.py'
      - 'src/beta_engine/domain/rankings/calendar_terminal_result.py'
      - 'src/beta_engine/infrastructure/db/calendar_standalone_match_state.py'
      - 'web/src/pages/CalendarTour*'
      - 'web/src/pages/NativeTransitionReadiness*'
      - 'web/src/api/nativeTransitionReadiness.ts'
      - 'web/src/api/calendarTour.ts'
      - 'web/src/api/client.ts'
  workflow_dispatch:

concurrency:
  group: native-tour-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  birth-readiness:
    # Draft work gets Fast CI; review/manual runs retain full acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native birth readiness / real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]' playwright
      - run: npm --prefix web ci
      - name: Native birth, explicit Save and unchanged pre-Save Viewer
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_BIN" ]; then
            python -m playwright install --with-deps chromium
            export CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          fi
          timeout --signal=TERM --kill-after=10s 8m python scripts/native_birth_readiness_browser_acceptance.py --root work/native-birth-readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-birth-readiness-${{ github.run_id }}
          path: work/native-birth-readiness/*
          retention-days: 14

  post-intake:
    # Draft work gets Fast CI; review/manual runs retain full acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native post-intake competition / real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]' playwright
      - run: npm --prefix web ci
      - name: Native post-intake Edition, Entry, real matches and explicit Save
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_BIN" ]; then
            python -m playwright install --with-deps chromium
            export CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          fi
          timeout --signal=TERM --kill-after=10s 8m python scripts/native_post_intake_tour_browser_acceptance.py --root work/native-post-intake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-post-intake-${{ github.run_id }}
          path: work/native-post-intake/*
          retention-days: 14

  source-epochs:
    # Draft work gets Fast CI; review/manual runs retain full acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native future prospect epoch Admin / real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]' playwright
      - run: npm --prefix web ci
      - name: Future cohort generation, immutable source epoch and manual Saved boundary
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          if [ ! -x "$CHROME_BIN" ]; then
            python -m playwright install --with-deps chromium
            export CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          fi
          timeout --signal=TERM --kill-after=10s 8m python scripts/native_prospect_source_epochs_browser_acceptance.py --root work/native-source-epochs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-epochs-${{ github.run_id }}
          path: work/native-source-epochs/*
          retention-days: 14

  browser:
    # Draft work gets Fast CI; review/manual runs retain full acceptance.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Native Tour W${{ matrix.width }} / ${{ matrix.players }} players
    runs-on: ubuntu-latest
    # A performance regression must fail promptly rather than consuming another
    # 25-30 minute CI cycle. The full W80 scenario remains mandatory.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 52, offset: 35, players: 8}
          - {width: 61, offset: 37, players: 8}
          - {width: 80, offset: 80, players: 1000}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e '.[dev]' playwright
      - run: npm --prefix web ci
      - name: Prepare Chromium
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
            echo "CHROME_BIN=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
          fi
      - name: Configured Editions, real matches, manual Save and physical restart
        # Fail with explicit exit 124 BEFORE GitHub cancels the entire job at
        # its outer deadline. Upload progress.json on failure for diagnostics.
        run: |
          timeout --signal=TERM --kill-after=10s 18m \
            python scripts/native_tour_browser_acceptance.py \
              --root work/native-tour --width ${{ matrix.width }} \
              --offset ${{ matrix.offset }} --players ${{ matrix.players }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tour-W${{ matrix.width }}-${{ matrix.players }}-${{ github.run_id }}
          path: |
            work/native-tour/*.json
            work/native-tour/*.png
            work/native-tour/*.log
            work/native-tour/*.sqlite*
          retention-days: 14

name: Diagnostic bounded cold Saved v2 lineage A/B on one runner

# Diagnostic evidence for the bounded cold lineage Draft PR only. It is added and
# removed again by separate diagnostic commits; it never runs on buuk. It runs
# only for a push of this branch whose head commit message carries the tag.
on:
  push:
    branches: [claude/inspiring-dirac-d2aqk6]

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-bounded-cold-lineage-ab
  cancel-in-progress: false

env:
  BUUK_SHA: 71f03fb9242427d3dbc46d9106d58d21442df98c          # buuk after #1836
  PR1838_SHA: f8cad4e03b502d854352e7bfb7c2d1b7c0a74134                                        # #1838 diff alone on buuk (first PR commit)
  W9_RUN_ID: '44612526515'
  W9_ARTIFACT: pr1828-one-shot-w9-44612526515                  # artifact 14581530042

jobs:
  linux-ab:
    if: contains(github.event.head_commit.message, '[bounded-cold-ab]')
    name: "W9/W10/W12 cold reopen + continuation: buuk / #1838 alone / candidate, one runner, 120 s"
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/fast-ci-linux.lock.txt
      - name: Engine trees and runner
        shell: bash
        run: |
          set -euo pipefail
          # The diagnostic commit itself changes no engine source or test.
          git diff --quiet HEAD^ HEAD -- src tests
          CANDIDATE_SHA=$(git rev-parse HEAD^)
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          for tree in buuk:$BUUK_SHA pr1838:$PR1838_SHA candidate:$CANDIDATE_SHA; do
            git worktree add --detach "$RUNNER_TEMP/${tree%%:*}" "${tree#*:}"
          done
          mkdir -p evidence
          { echo "workflow head $(git rev-parse HEAD)"; for t in buuk pr1838 candidate; do echo "$t $(git -C $RUNNER_TEMP/$t rev-parse HEAD)"; done
            nproc; free -m; lscpu | grep -E 'Model name|^CPU\(s\)'; python --version; } | tee evidence/runner.txt
      - name: Download the retained W9 fixture (artifact 14581530042)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$W9_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$W9_ARTIFACT" -D w9
          sha256sum w9/giant-w9-evidence/before-restart.sqlite | tee evidence/fixture.sha256
      - name: "W9 cold reopen + W10 continuation per tree (fresh fixture copies, 120 s deadline)"
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_EVENT_NAME: giant_native_load
        shell: bash
        run: |
          set -uo pipefail
          F=w9/giant-w9-evidence
          for tree in buuk pr1838 candidate; do
            python scripts/diagnostics/w10_continuation_benchmark.py --checkout "$RUNNER_TEMP/$tree" \
              --fixture $F/before-restart.sqlite --meta $F/before-restart.json \
              --out "$RUNNER_TEMP/runs/$tree-w10" --weeks 10 --deterministic-ids \
              > "evidence/$tree-w10.log" 2>&1 || echo "$tree W10 did not complete" | tee -a evidence/notes.txt
            mkdir -p "evidence/$tree-w10"
            cp "$RUNNER_TEMP/runs/$tree-w10"/{requests.jsonl,summary.json,history.json} "evidence/$tree-w10/" 2>/dev/null || true
            tail -1 "$RUNNER_TEMP/runs/$tree-w10/requests.jsonl" || true
          done
      - name: W10 result equality with buuk
        shell: bash
        run: |
          set -uo pipefail
          for tree in pr1838 candidate; do
            python scripts/diagnostics/w10_compare_runs.py w9/giant-w9-evidence/before-restart.sqlite \
              "$RUNNER_TEMP/runs/buuk-w10" "$RUNNER_TEMP/runs/$tree-w10" "evidence/compare-w10-buuk-$tree.json" \
              || echo "W10 buuk vs $tree not identical" | tee -a evidence/notes.txt
          done
      - name: Candidate W11-W12 continuation (builds the W12 database)
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_EVENT_NAME: giant_native_load
        shell: bash
        run: |
          set -uo pipefail
          F=w9/giant-w9-evidence
          python scripts/diagnostics/w10_continuation_benchmark.py --checkout "$RUNNER_TEMP/candidate" \
            --fixture $F/before-restart.sqlite --meta $F/before-restart.json \
            --start-db "$RUNNER_TEMP/runs/candidate-w10/run.sqlite" --out "$RUNNER_TEMP/runs/candidate-w11-12" \
            --weeks 11 --weeks 12 --deterministic-ids --id-offset 1000000 \
            > evidence/candidate-w11-12.log 2>&1 || echo "candidate W11-W12 did not complete" | tee -a evidence/notes.txt
          mkdir -p evidence/candidate-w11-12
          cp "$RUNNER_TEMP/runs/candidate-w11-12"/{requests.jsonl,summary.json,history.json} evidence/candidate-w11-12/ 2>/dev/null || true
      - name: Cold first read of the same W9, W10 and W12 databases by each tree (no client deadline)
        shell: bash
        run: |
          set -uo pipefail
          F=w9/giant-w9-evidence
          declare -A DB=( [w9]=$F/before-restart.sqlite [w10]=$RUNNER_TEMP/runs/candidate-w10/run.sqlite
                          [w12]=$RUNNER_TEMP/runs/candidate-w11-12/run.sqlite )
          declare -A META=( [w9]=$F/before-restart.json [w10]=$RUNNER_TEMP/runs/candidate-w10/final-meta.json
                            [w12]=$RUNNER_TEMP/runs/candidate-w11-12/final-meta.json )
          for point in w9 w10 w12; do
            for tree in buuk pr1838 candidate; do
              python scripts/diagnostics/bounded_cold_read.py "$RUNNER_TEMP/$tree" "${DB[$point]}" "${META[$point]}" \
                "evidence/cold-$point-$tree.json" || echo "$tree cold $point failed" | tee -a evidence/notes.txt
            done
          done
      - name: "W12 cold reopen + W13 continuation per tree (same W12 database, 120 s deadline after the first read)"
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_EVENT_NAME: giant_native_load
        shell: bash
        run: |
          set -uo pipefail
          F=w9/giant-w9-evidence
          for tree in buuk pr1838 candidate; do
            python scripts/diagnostics/w10_continuation_benchmark.py --checkout "$RUNNER_TEMP/$tree" \
              --fixture $F/before-restart.sqlite --meta $F/before-restart.json \
              --start-db "$RUNNER_TEMP/runs/candidate-w11-12/run.sqlite" --out "$RUNNER_TEMP/runs/$tree-w13" \
              --weeks 13 --deterministic-ids --id-offset 2000000 --first-inspect-timeout 3600 \
              > "evidence/$tree-w13.log" 2>&1 || echo "$tree W13 did not complete" | tee -a evidence/notes.txt
            mkdir -p "evidence/$tree-w13"
            cp "$RUNNER_TEMP/runs/$tree-w13"/{requests.jsonl,summary.json,history.json} "evidence/$tree-w13/" 2>/dev/null || true
          done
          for tree in pr1838 candidate; do
            python scripts/diagnostics/w10_compare_runs.py "$RUNNER_TEMP/runs/candidate-w11-12/run.sqlite" \
              "$RUNNER_TEMP/runs/buuk-w13" "$RUNNER_TEMP/runs/$tree-w13" "evidence/compare-w13-buuk-$tree.json" \
              || echo "W13 buuk vs $tree not identical" | tee -a evidence/notes.txt
          done
      - name: Growth report
        if: always()
        shell: bash
        run: |
          python scripts/diagnostics/w10_growth_report.py \
            $(for r in buuk-w10 pr1838-w10 candidate-w10 candidate-w11-12 buuk-w13 pr1838-w13 candidate-w13; do
                [ -d "$RUNNER_TEMP/runs/$r" ] && printf '%s=%s ' "$r" "$RUNNER_TEMP/runs/$r"; done) \
            --cold $(for f in evidence/cold-*.json; do [ -f "$f" ] && printf '%s=%s ' "$(basename "$f" .json)" "$f"; done) \
            | tee evidence/growth.json || true
          cat evidence/notes.txt 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-cold-ab-${{ github.run_id }}
          path: evidence/
          retention-days: 21
      - name: Upload W10/W12 databases for the Windows cold reads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-cold-databases-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runs/candidate-w10/run.sqlite
            ${{ runner.temp }}/runs/candidate-w10/final-meta.json
            ${{ runner.temp }}/runs/candidate-w11-12/run.sqlite
            ${{ runner.temp }}/runs/candidate-w11-12/final-meta.json
          retention-days: 7

  windows-cold:
    needs: linux-ab
    if: always() && needs.linux-ab.result != 'skipped'
    name: "Windows (separate): cold first read at W9/W10/W12, buuk vs candidate"
    runs-on: windows-latest
    timeout-minutes: 150
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install locked Windows wheels
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/windows-preview-win-amd64.lock.txt
      - uses: actions/download-artifact@v4
        with:
          name: bounded-cold-databases-${{ github.run_id }}
          path: dbs
      - name: Trees, fixtures and runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/buuk" "$BUUK_SHA"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$(git rev-parse HEAD^)"
          gh run download "$W9_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$W9_ARTIFACT" -D w9
          mkdir -p evidence-windows
          { systeminfo | grep -E "OS Name|Total Physical Memory|Processor"; python --version; find dbs -type f; } | tee evidence-windows/runner.txt || true
      - name: Cold first read per tree and point (no client deadline)
        shell: bash
        run: |
          set -uo pipefail
          W10=$(dirname "$(find dbs -path '*candidate-w10*' -name run.sqlite | head -1)")
          W12=$(dirname "$(find dbs -path '*candidate-w11-12*' -name run.sqlite | head -1)")
          for point in w9 w10 w12; do
            case $point in
              w9) DB=w9/giant-w9-evidence/before-restart.sqlite; META=w9/giant-w9-evidence/before-restart.json ;;
              w10) DB=$W10/run.sqlite; META=$W10/final-meta.json ;;
              w12) DB=$W12/run.sqlite; META=$W12/final-meta.json ;;
            esac
            for tree in buuk candidate; do
              python scripts/diagnostics/bounded_cold_read.py "$RUNNER_TEMP/$tree" "$DB" "$META" \
                "evidence-windows/cold-$point-$tree.json" || echo "$tree cold $point failed" | tee -a evidence-windows/notes.txt
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bounded-cold-windows-${{ github.run_id }}
          path: evidence-windows/
          retention-days: 21
